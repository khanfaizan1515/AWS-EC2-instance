```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>File Upload</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            font-size: 35px;
        }

        h1 {
            color: #222;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #6a11cb;
            border-radius: 15px;
            padding: 30px 20px;
            background: #f8f5ff;
            transition: 0.3s;
        }

        .upload-box:hover {
            background: #f0eaff;
            border-color: #2575fc;
        }

        .upload-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .upload-box p {
            color: #555;
            margin-bottom: 18px;
        }

        input[type="file"] {
            display: none;
        }

        .choose-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #6a11cb;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .choose-btn:hover {
            background: #2575fc;
            transform: translateY(-2px);
        }

        #fileName {
            margin-top: 15px;
            color: #2575fc;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }

        .upload-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff512f, #dd2476);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(221, 36, 118, 0.3);
        }

        .info {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
            line-height: 1.6;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            ↑
        </div>

        <h1>Upload Your File</h1>

        <p class="subtitle">
            Select a file and upload it securely to the server
        </p>

        <form id="uploadForm"
              action="/upload"
              method="post"
              enctype="multipart/form-data">

            <div class="upload-box">

                <div class="upload-icon">
                    📁
                </div>

                <p>Choose an image or PDF file</p>

                <label for="myFile" class="choose-btn">
                    Choose File
                </label>

                <input
                    type="file"
                    id="myFile"
                    name="myFile"
                    accept=".jpg,.jpeg,.png,.gif,.pdf"
                    required
                >

                <div id="fileName">
                    No file selected
                </div>

            </div>

            <button type="submit" class="upload-btn">
                Upload File
            </button>

        </form>

        <div class="info">
            Supported formats: JPG, JPEG, PNG, GIF and PDF<br>
            Maximum file size: 1 MB
        </div>

        <div class="footer">
            Secure File Upload System
        </div>

    </div>

    <script>
        const fileInput = document.getElementById("myFile");
        const fileName = document.getElementById("fileName");

        fileInput.addEventListener("change", function () {

            if (this.files.length > 0) {
                fileName.textContent = "Selected: " + this.files[0].name;
            } else {
                fileName.textContent = "No file selected";
            }

        });
    </script>

</body>
</html>
